[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kd-vs-hpo"
version = "0.1.0"
description = "Knowledge distillation and Hyper parameter optimization recipes."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "calflops>=0.3.2",
    "ipywidgets>=8.1.8",
    "lightning>=2.6.5",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "scipy>=1.14",
    "tensorboard>=2.20.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "transformers>=5.10.2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.8",
    "ruff>=0.15.16",
]
