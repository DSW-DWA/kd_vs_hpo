defaults:
  - hpo_base
  - _self_

# 50 new trials with 30% label noise in train and validation; test stays clean.
output_dir: outputs/hpo_1342_noise30_tpe_50
arch_rows: [6]
num_processes: 1
label_noise: 0.3
imported_trials: []

optuna:
  n_trials: 50
  max_epochs: 200
  samplers: [tpe]
  pruners: [none]
  startup_trials: 5
  fixed_trial_seed: true
  fresh_dataloaders_per_trial: true
