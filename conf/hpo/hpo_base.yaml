device: auto

output_dir: outputs/hpo_8712_tpe_hyperband
checkpoint_dir: ${hpo.output_dir}/checkpoints
log_dir: ${hpo.output_dir}/runs
arch_rows:
  - 2
num_processes: 2
gpu_ids:
  - 0
  - 1

imported_trial:
  checkpoint_path: outputs/plain_pool_3_archs/checkpoints/arch_8712_initial.pt
  metrics_path: outputs/plain_pool_3_archs/initial/arch_8712/checkpoints/arch_8712_initial/metrics.csv

search_space:
  lr:
    - 9.0e-2
    - 1.1e-1
  weight_decay:
    - 4.5e-4
    - 5.5e-4
  initial_lr: 1.0e-1
  initial_weight_decay: 5.0e-4
  grid_lr:
    - 9.0e-2
    - 1.0e-1
    - 1.1e-1
  grid_weight_decay:
    - 4.5e-4
    - 5.0e-4
    - 5.5e-4

optuna:
  n_trials: 20
  max_epochs: 200
  samplers:
    - tpe
  pruners:
    - hyperband
  startup_trials: 2
  min_resource: 10
  reduction_factor: 3
  fixed_trial_seed: true
  fresh_dataloaders_per_trial: true
