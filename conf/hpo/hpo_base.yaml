device: auto

output_dir: outputs/hpo_8712_tpe_50
checkpoint_dir: ${hpo.output_dir}/checkpoints
log_dir: ${hpo.output_dir}/runs
arch_rows:
  - 2
num_processes: 1
gpu_ids:
  - 0

imported_trials:
  - checkpoint_path: outputs/plain_pool_3_archs/checkpoints/arch_8712_initial.pt
    metrics_path: outputs/plain_pool_3_archs/initial/arch_8712/checkpoints/arch_8712_initial/metrics.csv
    lr: 1.0e-1
    weight_decay: 5.0e-4
  - checkpoint_path: outputs/plain_pool_3_archs/checkpoints/arch_8712_sample_1.pt
    metrics_path: outputs/plain_pool_3_archs/sample_1/arch_8712/checkpoints/arch_8712_sample_1/metrics.csv
    lr: 1.1e-1
    weight_decay: 4.5e-4
  - checkpoint_path: outputs/plain_pool_3_archs/checkpoints/arch_8712_sample_2.pt
    metrics_path: outputs/plain_pool_3_archs/sample_2/arch_8712/checkpoints/arch_8712_sample_2/metrics.csv
    lr: 9.0e-2
    weight_decay: 5.5e-4
  - checkpoint_path: outputs/plain_pool_3_archs/checkpoints/arch_8712_sample_3.pt
    metrics_path: outputs/plain_pool_3_archs/sample_3/arch_8712/checkpoints/arch_8712_sample_3/metrics.csv
    lr: 1.1e-1
    weight_decay: 5.5e-4
  - checkpoint_path: outputs/plain_pool_3_archs/checkpoints/arch_8712_sample_4.pt
    metrics_path: outputs/plain_pool_3_archs/sample_4/arch_8712/checkpoints/arch_8712_sample_4/metrics.csv
    lr: 9.0e-2
    weight_decay: 4.5e-4

search_space:
  lr:
    - 9.0e-2
    - 1.1e-1
  weight_decay:
    - 4.5e-4
    - 5.5e-4
  initial_lr: 1.0e-1
  initial_weight_decay: 5.0e-4
  grid_lr:
    - 9.0e-2
    - 1.0e-1
    - 1.1e-1
  grid_weight_decay:
    - 4.5e-4
    - 5.0e-4
    - 5.5e-4

optuna:
  n_trials: 50
  max_epochs: 200
  samplers:
    - tpe
  pruners:
    - none
  startup_trials: 5
  min_resource: 10
  reduction_factor: 3
  fixed_trial_seed: true
  fresh_dataloaders_per_trial: true
