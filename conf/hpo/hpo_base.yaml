# Shared defaults. Select a named HPO config or override fields for a run.
device: auto

output_dir: outputs/hpo
checkpoint_dir: ${hpo.output_dir}/checkpoints
log_dir: ${hpo.output_dir}/runs
arch_rows: null
num_processes: 1.
gpu_ids: null

imported_trials: []

search_space:
  lr:
    - 1.0e-5
    - 3.0e-1
  weight_decay:
    - 1.0e-7
    - 5.0e-3
  batch_size: [16, 512]
  batch_size_step: 16
  momentum: [0.0, 0.9]
  initial_batch_size: 256
  initial_momentum: 0.9
  grid_momentum: [0.0, 0.45, 0.9]
  initial_lr: 1.0e-1
  initial_weight_decay: 5.0e-4
  grid_lr:
    - 9.0e-2
    - 1.0e-1
    - 1.1e-1
  grid_weight_decay:
    - 4.5e-4
    - 5.0e-4
    - 5.5e-4

optuna:
  n_trials: 50
  max_epochs: 200
  samplers:
    - tpe
  pruners:
    - none
  startup_trials: 5
  min_resource: 10
  reduction_factor: 3
  fixed_trial_seed: true
  fresh_dataloaders_per_trial: true
